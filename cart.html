<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ShopEase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes fadeOutSlide {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }
        
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .animate-fadeInSlide {
            animation: fadeInSlide 0.3s ease-out;
        }
        
        .animate-fadeInScale {
            animation: fadeInScale 0.4s ease-out;
        }
        
        button {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>
    <!-- Navbar will be inserted here -->
    <nav id="navbar"></nav>

    <!-- Cart Container -->
    <div class="min-h-screen bg-gray-50 py-12 px-4">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl font-bold text-gray-800 mb-8">Shopping Cart</h1>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Cart Items -->
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <div id="cart-items">
                            <!-- Cart items will be rendered here -->
                        </div>
                    </div>
                </div>
                
                <!-- Cart Summary -->
                <div id="cart-summary" class="lg:col-span-1">
                    <div class="bg-white rounded-lg shadow-md p-6 sticky top-20">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">Order Summary</h2>
                        
                        <!-- Subtotal -->
                        <div class="flex justify-between mb-4 pb-4 border-b">
                            <span class="text-gray-600">Subtotal:</span>
                            <span class="font-semibold">$<span id="cart-total">0.00</span></span>
                        </div>
                        
                        <!-- Shipping -->
                        <div class="flex justify-between mb-4 pb-4 border-b">
                            <span class="text-gray-600">Shipping:</span>
                            <span class="font-semibold">Free</span>
                        </div>
                        
                        <!-- Total -->
                        <div class="flex justify-between mb-6 text-lg">
                            <span class="font-bold text-gray-800">Total:</span>
                            <span class="font-bold text-blue-600">$<span id="cart-total">0.00</span></span>
                        </div>
                        
                        <!-- Checkout Button -->
                        <a href="checkout.html" class="w-full block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg text-center transition transform hover:scale-105 mb-3">
                            Proceed to Checkout
                        </a>
                        
                        <!-- Continue Shopping Link -->
                        <a href="index.html" class="w-full block border border-blue-600 hover:border-blue-700 text-blue-600 hover:text-blue-700 font-bold py-3 px-4 rounded-lg text-center transition">
                            Continue Shopping
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
